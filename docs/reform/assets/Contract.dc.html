<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', system-ui, sans-serif; }
    a { color: #e33e21; } a:hover { color: #c93318; }
  </style>
</helmet>
<div style="width: 390px; min-height: 1020px; background: #f6f4f1; display: flex; flex-direction: column; color: #292524;">

  <div style="display: flex; align-items: center; gap: 8px; padding: 16px;">
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#292524" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </div>
    <div style="display: flex; flex-direction: column;">
      <div style="font-size: 17px; font-weight: 700;">契約手続き</div>
      <div style="font-size: 12px; color: #78716c;">田中様邸｜浴室・洗面改装工事</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 16px; padding: 0 16px 24px 16px;">

    <div style="background: #ffffff; border: 1px solid #e7e2db; border-radius: 12px; padding: 16px; display: flex; flex-direction: column;">
      <div style="font-size: 14px; font-weight: 700; padding-bottom: 10px;">ご契約内容</div>
      <div style="display: flex; justify-content: space-between; padding: 9px 0; border-top: 1px solid #f0ede8; font-size: 13px;"><span style="color: #78716c;">工事名称</span><span style="font-weight: 500;">浴室・洗面改装工事</span></div>
      <div style="display: flex; justify-content: space-between; padding: 9px 0; border-top: 1px solid #f0ede8; font-size: 13px;"><span style="color: #78716c;">採用プラン</span><span style="font-weight: 500;">竹(スタンダード＋)</span></div>
      <div style="display: flex; justify-content: space-between; padding: 9px 0; border-top: 1px solid #f0ede8; font-size: 13px;"><span style="color: #78716c;">契約金額</span><span style="font-weight: 700; font-size: 15px;">¥1,903,000(税込)</span></div>
      <div style="display: flex; justify-content: space-between; padding: 9px 0; border-top: 1px solid #f0ede8; font-size: 13px;"><span style="color: #78716c;">施工日時</span><span style="font-weight: 500;">10/6(月) 8:00 〜 12:00</span></div>
      <div style="display: flex; justify-content: space-between; padding: 9px 0 2px 0; border-top: 1px solid #f0ede8; font-size: 13px;"><span style="color: #78716c;">お支払条件</span><span style="font-weight: 500;">完工後 一括</span></div>
    </div>

    <div style="background: #ffffff; border: 1px solid #e7e2db; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
      <div style="font-size: 14px; font-weight: 700;">ご説明の確認</div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="width: 24px; height: 24px; border-radius: 12px; background: #e33e21; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <div style="font-size: 13px;">見積内容・仕様のご説明</div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="width: 24px; height: 24px; border-radius: 12px; background: #e33e21; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <div style="font-size: 13px;">追加費用の可能性(解体後の変動リスク)のご説明</div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="width: 24px; height: 24px; border-radius: 12px; background: #e33e21; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <div style="font-size: 13px;">クーリングオフ制度のご説明・書面交付</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 14px; font-weight: 700;">ご署名</div>
      <div style="height: 180px; border: 2px dashed #ddd6cc; border-radius: 12px; background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path><circle cx="11" cy="11" r="2"></circle></svg>
        <div style="font-size: 13px; color: #a8a29e;">こちらに指またはペンでご署名ください</div>
      </div>
      <div style="display: flex; justify-content: flex-end;">
        <div style="font-size: 13px; color: #57534e; padding: 8px 4px;">書き直す</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="height: 52px; border-radius: 12px; background: #e33e21; color: #ffffff; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        <span>契約を締結する</span>
      </div>
      <div style="font-size: 12px; color: #78716c; text-align: center; line-height: 1.6;">締結後、契約書PDFをお客様のメールへ自動送付します。<br>クーリングオフ書面も同時に交付されます。</div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
